name: Unpack uploaded portfolio assets
on:
  push:
    paths:
      - '.github/workflows/unpack-portfolio.yml'
      - 'Anton_Semaun_Portfolio_GitHub_Pages_Universal.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract media into the website
        shell: bash
        run: |
          set -euo pipefail
          ZIP=Anton_Semaun_Portfolio_GitHub_Pages_Universal.zip
          if [ ! -f "$ZIP" ]; then
            echo "ZIP already unpacked; nothing to do."
            exit 0
          fi
          unzip -q "$ZIP" 'assets/*' -d .
          test -d assets
          test "$(find assets -type f | wc -l)" -eq 39
          test "$(find assets -name '*.mp4' | wc -l)" -eq 20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git rm "$ZIP"
          git commit -m "Extract 39 website media assets and remove uploaded archive"
          git push
